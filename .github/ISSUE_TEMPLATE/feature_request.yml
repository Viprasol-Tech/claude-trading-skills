name: Skill request
description: A trading task the plugin should handle
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: The task
      description: What are you building or checking, and on which platform (TradingView, MT5, Binance, Kalshi, Python...)?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Tools, scripts or manual steps (optional).
